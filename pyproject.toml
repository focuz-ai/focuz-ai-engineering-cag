[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focuz-cag-lab"
version = "1.1.0"
description = "CAG con contexto autorizado, caché y proveedor intercambiable"
requires-python = ">=3.11"
authors = [{name = "Focuz"}]
dependencies = []

[project.urls]
Repository = "https://github.com/focuz-ai/focuz-ai-engineering-cag"

[tool.setuptools.packages.find]
include = ["cag*"]
